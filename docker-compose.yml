      context: .
      args:
        BUILD_GIT_HASH: ${BUILD_GIT_HASH:-unknown}
    image: unreal-index:latest
    container_name: unreal-index-spacewastecollector
    ports:
      - "3847:3847"
    volumes:
      - spacewastecollector-db:/data/db
      - spacewastecollector-mirror:/data/mirror
